# Menú ⋮ del detalle admin: editar el monto, pausar/reanudar y eliminar (con confirmación).
appId: com.gondroid.subtrack
---
- launchApp
- extendedWaitUntil:
    visible: "Suscripciones"
    timeout: 30000
- tapOn: "Suscripciones"
- tapOn: "Netflix Premium"
- assertVisible: "Cobrar a .*"
# Editar
- tapOn: "Más opciones"
- tapOn: "Editar"
- assertVisible: "Guardar cambios"
- tapOn: "Guardar cambios"
- assertVisible: "Cambios guardados"
# Pausar y reanudar
- tapOn: "Más opciones"
- tapOn: "Pausar"
- assertVisible: "PAUSADA"
- tapOn: "Más opciones"
- tapOn: "Reanudar"
- assertNotVisible: "PAUSADA"
# Eliminar
- tapOn: "Más opciones"
- tapOn: "Eliminar"
- assertVisible: "¿Eliminar Netflix Premium?"
- tapOn: "Eliminar"                    # botón del diálogo
- assertVisible: "Suscripción eliminada"
- assertNotVisible: "Netflix Premium"
