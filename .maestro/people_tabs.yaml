# Personas: título, selector "Te deben / Debes", sin el propio usuario en la lista.
# Inicio: el FAB abre el asistente.
appId: com.gondroid.subtrack
---
- runFlow: common/fresh_start.yaml
- tapOn: "Crear suscripción"          # FAB de Inicio
- assertVisible: "1/3"
- tapOn: "Cerrar asistente"
- tapOn: "Descartar"
- tapOn: "Personas"
- assertVisible: "Te deben.*"
- assertNotVisible: "Gonzalo Meza"    # tú no apareces en tu propia lista
- assertVisible: "Ana Paredes"
- tapOn: "Debes.*"
- assertVisible: "María Rodríguez"    # admin de Disney+, donde eres miembro
- assertVisible: "le debes|/mes"
